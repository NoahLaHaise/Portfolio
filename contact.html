<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get In Touch">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Image -->
    <div class="video-background">
        <div class="background-image other-page"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html"><h1>Portfolio</h1></a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="resume.html" class="nav-link">Resume</a></li>
                <li><a href="creative.html" class="nav-link">Creative & Tech</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="section contact-section page-content">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <p class="section-description">Let's connect and discuss opportunities</p>

            <div class="contact-content">
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <div class="info-item">
                        <strong>Email:</strong>
                        <a href="mailto:your.email@example.com">your.email@example.com</a>
                    </div>
                    <div class="info-item">
                        <strong>Location:</strong>
                        <span>City, Country</span>
                    </div>
                    <div class="info-item">
                        <strong>Availability:</strong>
                        <span>Open to opportunities</span>
                    </div>
                    <div class="social-links">
                        <a href="#" class="social-link" aria-label="LinkedIn">
                            <span>LinkedIn</span>
                        </a>
                        <a href="#" class="social-link" aria-label="GitHub">
                            <span>GitHub</span>
                        </a>
                        <a href="#" class="social-link" aria-label="Instagram">
                            <span>Instagram</span>
                        </a>
                    </div>
                </div>

                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Your Name. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
